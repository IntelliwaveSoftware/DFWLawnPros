# Local PostgreSQL for development and tests (Aurora PostgreSQL in production).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dfwlp
      POSTGRES_PASSWORD: dfwlp_dev_only
      POSTGRES_DB: dfwlp
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'dfwlp']
      interval: 2s
      retries: 30

volumes:
  postgres-data:
