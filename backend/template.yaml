AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DFW Lawn Pros — lead marketplace API (API Gateway HTTP API + one Lambda + Cognito)

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: postgresql://user:password@host:5432/dbname (RDS / Aurora PostgreSQL)
  AdminEmail:
    Type: String
    Default: ''
    AllowedPattern: '^([^\s@]+@[^\s@]+\.[^\s@]+)?$'
    Description: >-
      First admin for the dashboard. Cognito emails them an invitation with a temporary password, which they
      replace at first sign-in. Leave empty to create admins by hand. Removing it deletes that user.
  AnthropicWorkspaceId:
    Type: String
    Default: ''
    AllowedPattern: '^(wrkspc_[A-Za-z0-9]+)?$'
    Description: >-
      Claude Platform on AWS workspace (wrkspc_...) in this stack's region, used for AI enrichment.
      Leave empty to skip enrichment; leads are still accepted and scored.
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Leave empty to complete purchases without payment (MVP invoicing mode)
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
  SiteUrl:
    Type: String
    Default: http://localhost:5173
    Description: Public URL of the React site (Stripe redirects, CORS)
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
  EnrichmentModel:
    Type: String
    Default: claude-opus-5

Conditions:
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, '']]
  HasAnthropicWorkspace: !Not [!Equals [!Ref AnthropicWorkspaceId, '']]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 60

Resources:
  # ---------------------------------------------------------------- Auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
          TemporaryPasswordValidityDays: 7
      # Contractors sign themselves up; admins are invited (see BootstrapAdmin) and set a password at first sign-in.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageTemplate:
          EmailSubject: Your DFW Lawn Pros admin invitation
          EmailMessage: !Sub >-
            You've been invited to the DFW Lawn Pros admin dashboard.<br><br>
            Sign in at ${SiteUrl}/login?role=admin with your email {username} and this temporary password:
            <b>{####}</b><br><br>
            You'll choose your own password the first time you sign in. The temporary password expires in 7 days.
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Internal staff with access to the admin dashboard

  # The first dashboard admin, invited by email. More admins can be added by hand (see README).
  BootstrapAdmin:
    Type: AWS::Cognito::UserPoolUser
    Condition: HasAdminEmail
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: 'true'

  BootstrapAdminMembership:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Condition: HasAdminEmail
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: !Ref AdminGroup
      Username: !Ref BootstrapAdmin

  # ---------------------------------------------------------------- Maps
  # Browser key for the quote map: satellite tiles and address search (Amazon Location v2).
  # Public by design, so it can only read tiles and places, and only from the site's origins.
  MapsKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub ${AWS::StackName}-web-maps
      Description: DFW Lawn Pros website - satellite tiles and address search
      NoExpiry: true
      ForceUpdate: true
      ForceDelete: true
      Restrictions:
        AllowActions:
          - geo-maps:GetTile
          - geo-places:Autocomplete
          - geo-places:GetPlace
        AllowResources:
          - !Sub arn:aws:geo-maps:${AWS::Region}::provider/default
          - !Sub arn:aws:geo-places:${AWS::Region}::provider/default
        # Each allowed origin + local development (at most 5 entries).
        AllowReferers: !Split
          - ','
          - !Sub
            - '${Origins}/*,http://localhost:5173/*,http://127.0.0.1:5173/*'
            - Origins: !Join ['/*,', !Ref AllowedOrigins]

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, PATCH, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      # Each browser pings at most every 5 minutes; this caps abuse of the public route well below that.
      RouteSettings:
        GET /warmup:
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        # A handful of funnel steps per visitor; well above real traffic, far below abuse.
        POST /events:
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      # Prebuilt by `npm run build` (esbuild → dist/index.mjs); deploy with `npm run deploy`.
      CodeUri: dist
      Handler: index.handler
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          # Claude Platform on AWS; AWS_REGION is set by Lambda itself.
          ANTHROPIC_AWS_WORKSPACE_ID: !Ref AnthropicWorkspaceId
          ENRICHMENT_MODEL: !Ref EnrichmentModel
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          SITE_URL: !Ref SiteUrl
          NODE_OPTIONS: --enable-source-maps
          # Trust the Amazon RDS certificate authorities so TLS to Aurora verifies (bundled in the Node runtime).
          NODE_EXTRA_CA_CERTS: /var/runtime/ca-cert.pem
      Policies:
        # Async self-invocation for LLM enrichment after lead intake.
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-api
        # LLM enrichment through Claude Platform on AWS, signed with this function's role.
        - !If
          - HasAnthropicWorkspace
          - Statement:
              - Effect: Allow
                Action: aws-external-anthropic:CreateInference
                Resource: !Sub arn:aws:aws-external-anthropic:${AWS::Region}:${AWS::AccountId}:workspace/${AnthropicWorkspaceId}
          - !Ref AWS::NoValue
      Events:
        # Public
        SubmitLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /leads
            Auth:
              Authorizer: NONE
        Warmup:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /warmup
            Auth:
              Authorizer: NONE
        TrackEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /events
            Auth:
              Authorizer: NONE
        StripeWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /webhooks/stripe
            Auth:
              Authorizer: NONE
        # Admin (group check happens in code)
        ListLeads:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/leads
        GetLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/leads/{id}
        UpdateLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /admin/leads/{id}
        Analytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/analytics
        ListContractors:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/contractors
        UpdateContractor:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /admin/contractors/{id}
        GetRules:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/scoring-rules
        PutRules:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /admin/scoring-rules
        # Contractor
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /contractor/profile
        PutProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /contractor/profile
        AvailableLeads:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /contractor/leads/available
        PurchasedLeads:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /contractor/leads/purchased
        ContractorLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /contractor/leads/{id}
        PurchaseLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /contractor/leads/{id}/purchase
        UpdateOutcome:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /contractor/leads/{id}/outcome

Outputs:
  ApiUrl:
    Description: Set as VITE_API_BASE_URL in web/.env
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CognitoRegion:
    Value: !Ref AWS::Region
  CognitoClientId:
    Description: Set as VITE_COGNITO_CLIENT_ID in web/.env
    Value: !Ref UserPoolClient
  UserPoolId:
    Value: !Ref UserPool
  MapsKeyName:
    Description: Amazon Location API key the web build reads (aws location describe-key)
    Value: !Ref MapsKey
