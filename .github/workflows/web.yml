# Checks the site on every pull request; on main, builds it against the deployed API and publishes to CloudFront.
name: Web

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'shared/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The API URL and Cognito client come from the backend stack, so they never need copying by hand.
      - name: Read API stack outputs
        env:
          STACK_NAME: ${{ vars.API_STACK_NAME || 'dfwlawnpros-api' }}
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "VITE_API_BASE_URL=$(output ApiUrl)"
            echo "VITE_COGNITO_REGION=$(output CognitoRegion)"
            echo "VITE_COGNITO_CLIENT_ID=$(output CognitoClientId)"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_PHONE: ${{ vars.VITE_PUBLIC_PHONE }}
          VITE_PUBLIC_EMAIL: ${{ vars.VITE_PUBLIC_EMAIL }}

      # Hashed assets first (cached forever), index.html last (never cached), so visitors never get an
      # index.html pointing at files that aren't uploaded yet. Old assets are kept, not deleted, so
      # open tabs can still lazy-load the route chunks they were built with.
      - name: Upload to S3
        env:
          BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --exclude "index.html" --cache-control "public,max-age=3600"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query Invalidation.Id --output text
